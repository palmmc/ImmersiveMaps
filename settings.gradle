pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ImmersiveMaps'

include 'common'
include 'fabric'
include 'neoforge'

def wayfarerDir = file('../Wayfarer')
if (!wayfarerDir.exists()) {
    wayfarerDir = file('Wayfarer')
}
if (wayfarerDir.exists()) {
    includeBuild(wayfarerDir) {
        dependencySubstitution {
            def wayfarerVersion = providers.gradleProperty('wayfarer_version').getOrNull()
            if (wayfarerVersion != null) {
                substitute module("maven.modrinth:wayfarerlib:${wayfarerVersion}-common") using project(':common')
                substitute module("maven.modrinth:wayfarerlib:${wayfarerVersion}-fabric") using project(':fabric')
                substitute module("maven.modrinth:wayfarerlib:${wayfarerVersion}-neoforge") using project(':neoforge')
            }
        }
    }
}

